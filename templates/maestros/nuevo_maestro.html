{% extends "layout.html" %}
{% block container %}

<div class="p-8 flex items-center justify-center">
  <div class="bg-white rounded-lg shadow-lg max-w-md w-full mx-4 dark:bg-gray-800 p-6 mt-16">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-bold text-gray-900 dark:text-white">Agregar Nuevo Maestro</h3>
    </div>
    <form method="POST" action="{{ url_for('maestros_bp.nuevo_maestro') }}" class="space-y-4">
      {{ form.csrf_token }}
      <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-white">Matrícula</label>
        <input type="number" name="matricula"
          class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-white">Nombre</label>
        <input type="text" name="nombre"
          class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-white">Apellidos</label>
        <input type="text" name="apellidos"
          class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-white">Especialidad</label>
        <input type="text" name="especialidad"
          class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-900 dark:text-white">Email</label>
        <input type="email" name="email"
          class="w-full px-3 py-2 border border-gray-300 rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          required>
      </div>
      <div class="flex gap-3 mt-6">
        <a href="{{ url_for('index') }}"
          class="flex-1 px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 text-center">
          Cancelar
        </a>
        <button type="submit" class="flex-1 px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
