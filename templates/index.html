{% extends "layout.html" %}

{% block container %}
<div class="w-full max-w-6xl px-4 py-12 mx-auto">
    
    <div class="text-center mb-16">
        <h1 class="text-5xl font-extrabold text-white">
            Panel de Control <span class="text-blue-600"></span>
        </h1>
    </div>

    <div class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-4 mb-24">
        
        <a href="{{ url_for('maestros.maestros') }}" class="flex flex-col items-center p-8 bg-gray-800 border border-gray-700 rounded-2xl shadow-sm hover:scale-105 transition-all">
            <div class="p-4 mb-4 bg-blue-900/50 rounded-full text-blue-400">
                <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20"><path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3z"></path></svg>
            </div>
            <span class="text-xl font-bold text-white">Maestros</span>
        </a>

        <a href="{{ url_for('alumnos.lista') }}" class="flex flex-col items-center p-8 bg-gray-800 border border-gray-700 rounded-2xl shadow-sm hover:scale-105 transition-all">
            <div class="p-4 mb-4 bg-green-900/50 rounded-full text-green-400">
                <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a7 7 0 00-7 7v1h11v-1a7 7 0 00-7-7z"></path></svg>
            </div>
            <span class="text-xl font-bold text-white">Alumnos</span>
        </a>

        <a href="{{ url_for('cursos.lista') }}" class="flex flex-col items-center p-8 bg-gray-800 border border-gray-700 rounded-2xl shadow-sm hover:scale-105 transition-all">
            <div class="p-4 mb-4 bg-yellow-900/50 rounded-full text-yellow-400">
                <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"></path></svg>
            </div>
            <span class="text-xl font-bold text-white">Cursos</span>
        </a>

        <a href="{{ url_for('inscripciones.insertar') }}" class="flex flex-col items-center p-8 bg-gray-800 border border-gray-700 rounded-2xl shadow-sm hover:scale-105 transition-all">
            <div class="p-4 mb-4 bg-purple-900/50 rounded-full text-purple-400">
                <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"></path></svg>
            </div>
            <span class="text-xl font-bold text-white">Inscripciones</span>
        </a>

    </div>

    <div class="fixed bottom-10 left-1/2 z-50 w-full max-w-lg -translate-x-1/2 px-4">
        <div class="grid h-16 grid-cols-5 items-center rounded-full border border-gray-700 bg-gray-800/90 px-2 shadow-xl backdrop-blur-md">
            <a href="/" class="flex justify-center text-blue-500"><svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg></a>
            <a href="{{ url_for('maestros.maestros') }}" class="flex justify-center text-gray-400 hover:text-white"><svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a7 7 0 00-7 7v1h11v-1a7 7 0 00-7-7z"></path></svg></a>
            <div class="flex justify-center">
                <button class="flex h-12 w-12 items-center justify-center rounded-full bg-blue-600 text-white shadow-md hover:bg-blue-700">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>
            <a href="{{ url_for('cursos.lista') }}" class="flex justify-center text-gray-400 hover:text-white"><svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"></path></svg></a>
            <a href="{{ url_for('inscripciones.insertar') }}" class="flex justify-center text-gray-400 hover:text-white"><svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"></path></svg></a>
        </div>
    </div>
</div>
{% endblock %}
