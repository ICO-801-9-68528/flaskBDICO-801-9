{% extends "layout.html" %} {% block container %}

<div class="flex flex-col items-center justify-center w-full min-h-[70vh]">
  <h1 class="mb-10 text-4xl font-extrabold leading-none tracking-tight text-gray-900 md:text-5xl lg:text-6xl dark:text-white text-center">Panel de Control</h1>
  
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 w-full max-w-5xl p-4">
    <!-- Botón Maestros -->
    <a href="{{ url_for('maestros.maestros') }}" class="flex flex-col items-center justify-center p-8 bg-blue-500 rounded-2xl shadow-xl hover:bg-blue-600 transition-colors transform hover:-translate-y-2 duration-300">
      <svg class="w-14 h-14 text-white mb-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 18">
        <path d="M14 2a3.963 3.963 0 0 0-1.4.267 6.439 6.439 0 0 1-1.331 6.638A4 4 0 1 0 14 2Zm1 9h-1.264A6.957 6.957 0 0 1 15 15v2a2.97 2.97 0 0 1-.184 1H19a1 1 0 0 0 1-1v-1a5.006 5.006 0 0 0-5-5ZM6.5 9a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9ZM8 10H5a5.006 5.006 0 0 0-5 5v2a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-2a5.006 5.006 0 0 0-5-5Z"/>
      </svg>
      <h2 class="text-3xl font-bold text-white">Maestros</h2>
      <p class="text-blue-100 mt-2 text-center text-lg">Gestión completa de profesores</p>
    </a>

    <!-- Botón Alumnos -->
    <a href="{{ url_for('alumnos.lista') }}" class="flex flex-col items-center justify-center p-8 bg-emerald-500 rounded-2xl shadow-xl hover:bg-emerald-600 transition-colors transform hover:-translate-y-2 duration-300">
      <svg class="w-14 h-14 text-white mb-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 0a10 10 0 1 0 10 10A10.011 10.011 0 0 0 10 0Zm0 5a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 13a8.949 8.949 0 0 1-4.951-1.488A3.987 3.987 0 0 1 9 13h2a3.987 3.987 0 0 1 3.951 3.512A8.949 8.949 0 0 1 10 18Z"/>
      </svg>
      <h2 class="text-3xl font-bold text-white">Alumnos</h2>
      <p class="text-emerald-100 mt-2 text-center text-lg">Ver panel de alumnos inscritos</p>
    </a>

    <!-- Botón Cursos -->
    <a href="{{ url_for('cursos.lista') }}" class="flex flex-col items-center justify-center p-8 bg-indigo-500 rounded-2xl shadow-xl hover:bg-indigo-600 transition-colors transform hover:-translate-y-2 duration-300">
      <svg class="w-14 h-14 text-white mb-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd" d="M11 4.717c-2.286-.58-4.16-.756-7.045-.71A1.99 1.99 0 0 0 2 6v11c0 1.133.934 2.022 2.044 2.007 2.759-.038 4.5.16 6.956.791V4.717Zm2 15.081c2.456-.631 4.198-.829 6.956-.791A2.013 2.013 0 0 0 22 16.999V6a1.99 1.99 0 0 0-1.955-1.993c-2.885-.046-4.76.13-7.045.71v15.081Z" clip-rule="evenodd"/>
      </svg>
      <h2 class="text-3xl font-bold text-white">Cursos</h2>
      <p class="text-indigo-100 mt-2 text-center text-lg">Ver materias y cátedras</p>
    </a>

    <!-- Botón Inscripciones -->
    <a href="{{ url_for('inscripciones.lista') }}" class="flex flex-col items-center justify-center p-8 bg-orange-500 rounded-2xl shadow-xl hover:bg-orange-600 transition-colors transform hover:-translate-y-2 duration-300">
      <svg class="w-14 h-14 text-white mb-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd" d="M8 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1h2a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h2Zm6 1h-4v2H9a1 1 0 0 0 0 2h6a1 1 0 1 0 0-2h-1V4Zm-6 8a1 1 0 0 1 1-1h6a1 1 0 1 1 0 2H9a1 1 0 0 1-1-1Zm1 3a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2H9Z" clip-rule="evenodd"/>
      </svg>
      <h2 class="text-3xl font-bold text-white">Inscripciones</h2>
      <p class="text-orange-100 mt-2 text-center text-lg">Asignar alumnos a sus cursos</p>
    </a>
  </div>
</div>

{% endblock %}
