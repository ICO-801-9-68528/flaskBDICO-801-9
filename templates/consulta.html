{% extends "layout.html" %}

{% block container %}
<div class="w-full max-w-6xl px-4 py-12 mx-auto">
    <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-white">Consulta de Alumnos y Cursos</h1>
    </div>

    <div class="bg-gray-800 p-6 rounded-lg shadow-md">
        <table class="w-full text-left text-white">
            <thead>
                <tr>
                    <th class="border-b border-gray-700 px-4 py-2">Alumno</th>
                    <th class="border-b border-gray-700 px-4 py-2">Cursos Inscritos</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td class="border-b border-gray-700 px-4 py-2">{{ student.name }}</td>
                    <td class="border-b border-gray-700 px-4 py-2">
                        <ul>
                            {% for course in student.courses %}
                            <li>{{ course }}</li>
                            {% endfor %}
                        </ul>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
