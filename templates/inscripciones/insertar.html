{% extends "layout.html" %} {% block container %}
<div class="flex flex-col w-full px-5 py-10 items-center">
  <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-lg border border-gray-100 dark:bg-gray-800 dark:border-gray-700">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">Asignar Alumno a Curso</h2>
    
    <form method="POST" action="{{ url_for('inscripciones.insertar') }}" class="space-y-4">
        <!-- Render CSRF -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Seleccione Estudiante</label>
            <select name="alumno_id" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-orange-500 focus:border-orange-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                <option value="" disabled selected>-- Elige un Alumno --</option>
                {% for a in alumnos %}
                    <option value="{{ a.id }}">{{ a.nombre }} {{ a.apaterno }} {{ a.amaterno }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Seleccione Asignatura/Curso</label>
            <select name="curso_id" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-orange-500 focus:border-orange-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                <option value="" disabled selected>-- Elige un Curso --</option>
                {% for c in cursos %}
                    <option value="{{ c.id }}">{{ c.nombre }} (ID: {{ c.id }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="pt-4 flex items-center justify-between">
            <a href="{{ url_for('inscripciones.lista') }}" class="text-gray-600 hover:text-gray-900 flex items-center">
                Cancelar y Volver
            </a>
            <button type="submit" class="bg-orange-600 text-white hover:bg-orange-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center focus:ring-4 focus:outline-none focus:ring-orange-300">
                Guardar Inscripción
            </button>
        </div>
    </form>
  </div>
</div>
{% endblock %}
