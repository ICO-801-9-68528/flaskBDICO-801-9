<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowbite Flask</title>
    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
</head>
<body>
    <nav class="bg-white border-gray-200 px-2 sm:px-4 py-2.5 rounded-sm dark:bg-gray-900">
        <div class="container flex flex-wrap items-center justify-between mx-auto">
            <a href="#" class="flex items-center">
                <img src="{{url_for('static',filename='img/IDGS805.png')}}" class=" rounded-2xl h-6 mr-3 sm:h-9" alt="Flowbite Logo">
                <span class="self-center text-xl font-semibold whitespace-nowrap dark:text-white">Flask IDGS</span>
            </a>

            <div class="flex md:order-2">
                <button type="button"
                    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-3 md:mr-0 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                    Get started
                </button>
            </div>

            <!-- 🔥 AQUÍ SOLO CAMBIAMOS LINKS -->
            <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-cta">
                <ul
                    class="flex flex-col p-4 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:flex-row md:space-x-8 md:mt-0 md:text-sm md:font-medium md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700">
                    
                    <li>
                        <a href="{{url_for('index')}}"
                            class="block py-2 pl-3 pr-4 text-white bg-blue-700 rounded-sm md:bg-transparent md:text-blue-700 md:p-0 dark:text-white">
                            Dashboard
                        </a>
                    </li>

                    <!-- 🔥 NUEVO -->
                    <li>
                        <a href="{{url_for('maestros')}}"
                            class="block py-2 pl-3 pr-4 text-gray-700 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">
                            Maestros
                        </a>
                    </li>

                    <!-- 🔥 NUEVO -->
                    <li>
                        <a href="{{url_for('cursos')}}"
                            class="block py-2 pl-3 pr-4 text-gray-700 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">
                            Cursos
                        </a>
                    </li>

                    <!-- 🔥 NUEVO -->
                    <li>
                        <a href="{{url_for('usuario')}}"
                            class="block py-2 pl-3 pr-4 text-gray-700 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700 md:p-0">
                            Alumnos
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    
    <div class="flex items-center justify-center min-h-scree">
        
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <!-- 🔥 SOLO MEJORAMOS ESTILO (sin cambiar estructura) -->
                <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative m-2">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        
        {% block container %}
        {% endblock %} 
        
    </div>

    <!-- 🔥 MENÚ INFERIOR (SOLO AGREGAMOS LINKS REALES) -->
    <div class="fixed z-50 w-full h-16 max-w-lg -translate-x-1/2 bg-white border border-gray-200 rounded-full bottom-4 left-1/2 dark:bg-gray-700 dark:border-gray-600">
        <div class="grid h-full max-w-lg grid-cols-5 mx-auto">

            <!-- HOME -->
            <a href="{{url_for('index')}}" class="inline-flex flex-col items-center justify-center px-5 rounded-s-full hover:bg-gray-50 dark:hover:bg-gray-800 group">
                <svg class="w-5 h-5 mb-1 text-gray-500 group-hover:text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                    <path d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
                </svg>
                <span class="text-xs">Inicio</span>
            </a>

            <!-- ALUMNOS -->
            <a href="{{url_for('usuario')}}" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
                <span class="text-xs">Alumnos</span>
            </a>

            <!-- BOTÓN CENTRAL -->
            <div class="flex items-center justify-center">
                <button class="inline-flex items-center justify-center w-10 h-10 font-medium bg-blue-600 rounded-full">
                    +
                </button>
            </div>

            <!-- CURSOS -->
            <a href="{{url_for('cursos')}}" class="inline-flex flex-col items-center justify-center px-5 hover:bg-gray-50 group">
                <span class="text-xs">Cursos</span>
            </a>

            <!-- MAESTROS -->
            <a href="{{url_for('maestros')}}" class="inline-flex flex-col items-center justify-center px-5 rounded-e-full hover:bg-gray-50 group">
                <span class="text-xs">Maestros</span>
            </a>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>
</html>
