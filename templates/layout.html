<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask IDGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-white dark:bg-gray-900">

    <nav class="bg-gray-900 border-gray-700 dark:bg-gray-900">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="/" class="flex items-center space-x-3 rtl:space-x-reverse">
                <span class="self-center text-2xl font-semibold whitespace-nowrap text-white">Flask IDGS</span>
            </a>
            <div class="hidden w-full md:block md:w-auto" id="navbar-default">
                <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-gray-700 rounded-lg bg-gray-800 md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-gray-900">
                    <li><a href="/" class="block py-2 px-3 text-white rounded md:bg-transparent md:text-blue-500 md:p-0">Home</a></li>
                    <li><a href="#" class="block py-2 px-3 text-gray-400 hover:text-white md:p-0">About</a></li>
                    <li><a href="#" class="block py-2 px-3 text-gray-400 hover:text-white md:p-0">Services</a></li>
                    <li><a href="#" class="block py-2 px-3 text-gray-400 hover:text-white md:p-0">Contact</a></li>
                </ul>
            </div>
            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium">Get started</button>
        </div>
    </nav>

    <main>
        {% block container %}
        {% endblock %}
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>
</html>
