{% extends "layout.html" %} {% block container %}

<div class="flex flex-col w-full px-5">
<div class="py-10 mb-4 px-4 flex items-center justify-between">
    <h1 class="text-3xl font-extrabold dark:text-white text-gray-800">Lista de Alumnos</h1>
    <a
      href="{{ url_for('alumnos.alumnos') }}"
      class="bg-emerald-500 text-white px-5 py-2 rounded-lg shadow hover:bg-emerald-600 transition flex items-center gap-2"
    >
      <svg class="w-6 h-6 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12h4m-2 2v-4M4 18v-1a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Zm8-10a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
      </svg>
      Insertar Nuevo Alumno
    </a>
</div>

<div class="relative overflow-x-auto shadow-md sm:rounded-lg">
  <table class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400">
    <thead class="text-xs text-gray-700 uppercase bg-gray-100 dark:bg-gray-700 dark:text-gray-400">
      <tr>
        <th scope="col" class="px-6 py-4">Nombre</th>
        <th scope="col" class="px-6 py-4">Apaterno</th>
        <th scope="col" class="px-6 py-4">Amaterno</th>
        <th scope="col" class="px-6 py-4">Edad</th>
        <th scope="col" class="px-6 py-4">Correo</th>
        <th scope="col" class="px-6 py-4 text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for alum in alumno %}
      <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
        <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white">
          {{ alum.nombre }}
        </th>
        <td class="px-6 py-4">{{ alum.apaterno }}</td>
        <td class="px-6 py-4">{{ alum.amaterno }}</td>
        <td class="px-6 py-4">{{ alum.edad }}</td>
        <td class="px-6 py-4">{{ alum.correo }}</td>
        <td class="px-6 py-4 flex items-center justify-center gap-2">
            
          <a href="{{ url_for('alumnos.detalles', id=alum.id) }}" class="flex items-center gap-1 bg-indigo-500 text-white px-3 py-1.5 rounded hover:bg-indigo-600 shadow-sm text-xs transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 2a8 8 0 100 16 8 8 0 000-16zM8.5 11l3-3-3-3 1-1 4 4-4 4-1-1z" />
            </svg>
            Ver
          </a>
          
          <a href="{{ url_for('alumnos.modificar', id=alum.id) }}" class="flex items-center gap-1 bg-amber-500 text-white px-3 py-1.5 rounded hover:bg-amber-600 shadow-sm text-xs transition">
            <svg class="h-4 w-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="square" stroke-linejoin="round" stroke-width="2" d="M7 19H5a1 1 0 0 1-1-1v-1a3 3 0 0 1 3-3h1m4-6a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm7.441 1.559a1.907 1.907 0 0 1 0 2.698l-6.069 6.069L10 19l.674-3.372 6.07-6.07a1.907 1.907 0 0 1 2.697 0Z"/>
            </svg>
            Editar
          </a>

          <a href="{{ url_for('alumnos.eliminar', id=alum.id) }}" class="flex items-center gap-1 bg-red-500 text-white px-3 py-1.5 rounded hover:bg-red-600 shadow-sm text-xs transition">
            <svg class="h-4 w-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/>
            </svg>
            Borrar
          </a>

        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</div>
{% endblock %}
