{% extends "layout.html" %}

{% block container %}
<div class="p-4 sm:p-8">
    <div class="mb-6">
        <a href="{{ url_for('alumnos.alumnos') }}" class="inline-flex items-center px-5 py-2.5 text-sm font-medium text-center text-white bg-green-600 rounded-lg hover:bg-green-700 focus:ring-4 focus:ring-green-800 transition-all">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z"></path></svg>
            Insertar Nuevo Alumno
        </a>
    </div>

    <div class="relative overflow-x-auto shadow-md sm:rounded-lg border border-gray-700">
        <table class="w-full text-sm text-left text-gray-400">
            <thead class="text-xs text-gray-400 uppercase bg-gray-800/50 border-b border-gray-700">
                <tr>
                    <th scope="col" class="px-6 py-4 font-bold uppercase">Nombre</th>
                    <th scope="col" class="px-6 py-4 font-bold uppercase">Apellidos</th>
                    <th scope="col" class="px-6 py-4 font-bold uppercase">Edad</th>
                    <th scope="col" class="px-6 py-4 font-bold uppercase">Correo</th>
                    <th scope="col" class="px-6 py-4 text-center font-bold uppercase">Editar</th>
                    <th scope="col" class="px-6 py-4 text-center font-bold uppercase">Detalles</th>
                    <th scope="col" class="px-6 py-4 text-center font-bold uppercase">Eliminar</th>
                </tr>
            </thead>
            <tbody class="bg-gray-900">
                {% for alum in alumno %}
                <tr class="border-b border-gray-700 hover:bg-gray-800 transition-colors">
                    <th scope="row" class="px-6 py-4 font-medium text-white whitespace-nowrap">
                        {{ alum.nombre }}
                    </th>
                    <td class="px-6 py-4">
                        {{ alum.apaterno }} {{ alum.amaterno }}
                    </td>
                    <td class="px-6 py-4">
                        {{ alum.edad }}
                    </td>
                    <td class="px-6 py-4">
                        {{ alum.correo }}
                    </td>
                    
                    <td class="px-4 py-4 text-center">
                        <a href="{{ url_for('alumnos.modificar', id=alum.id) }}" class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-orange-500 rounded-lg hover:bg-orange-600 transition-colors">
                            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z"></path></svg>
                            Editar
                        </a>
                    </td>

                    <td class="px-4 py-4 text-center">
                        <a href="{{ url_for('alumnos.detalles', id=alum.id) }}" class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-purple-600 rounded-lg hover:bg-purple-700 transition-colors">
                            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd"></path></svg>
                            Detalles
                        </a>
                    </td>

                    <td class="px-4 py-4 text-center">
                        <a href="{{ url_for('alumnos.eliminar', id=alum.id) }}" class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600 transition-colors">
                            <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9z" clip-rule="evenodd"></path></svg>
                            Borrar
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
